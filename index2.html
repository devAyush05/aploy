<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm Sorry, Priya 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="hearts" aria-hidden="true"></div>

  <main class="hero">
    <div class="glass-card reveal">
      <div class="eyebrow">A little message from my heart</div>

      <div class="gif-frame">
        <iframe
          src="https://giphy.com/embed/jBpIWRkracpBEbOA0b"
          title="I'm sorry GIF"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>

      <p class="tiny-note">Okay… I know a GIF can't fix everything 😭</p>

      <h1>I'M SORRY,<br><span>PRIYA</span> 💗</h1>

      <p class="message">
        Mujhse galti ho gayi… and honestly,
        <strong>I'm really sorry.</strong><br>
        Bas ek baar dil se meri baat sun lena. 🥺
      </p>

      <button class="next-btn" id="nextBtn">
        <span>Next</span>
        <span class="arrow">→</span>
      </button>

      <div class="progress">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <p class="footer-note">Made with a guilty heart & a lot of love ♡</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
